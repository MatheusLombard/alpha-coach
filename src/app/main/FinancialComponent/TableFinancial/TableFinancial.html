<style>
  table {
    width: calc(100% + 32px);
    border-collapse: collapse;
    margin: -24px -16px;
  }
  thead {
    color: var(--cor-primaria);
  }
  thead th,
  tbody tr {
    text-align: start;
    padding: 16px;
  }
  td {
    border: 1px solid var(--border-subtle);
  }

  table tbody tr td {
    padding: 16px;
  }
  .div-students {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .div-students p {
    color: var(--cor-primaria);
  }
  .div-type {
    background-color: var(--bg-card);
    border: 1px solid var(--border-subtle);
    width: auto;
    padding: 8px 16px;
    border-radius: 25px;
    display: inline-block;
  }
  .div-type.danger {
    background-color: color-mix(in srgb, var(--cor-danger) 20%, transparent);
  }

  .div-type p {
    text-align: center;
    color: var(--cor-primaria);
    font-weight: 500;
  }
  .div-type.danger p, .div-type.danger i {
    color: var(--cor-danger);
  }
  .defaut-format {
    color: var(--cor-primaria);
    font-weight: 600;
  }
</style>

<table class="font-body">
  <thead>
    <th>Aluno</th>
    <th>Plano</th>
    <th>Parcela</th>
    <th>Valor</th>
    <th>Vencimento</th>
    <th>Status</th>
    <th></th>
  </thead>
  <tbody>
    @for (item of searchFinancial(); track item.id) {
      <tr>
        <td>
          <div class="div-students">
            <div class="dsc-students">
              <h3>{{ item.alunoNome }}</h3>
            </div>
          </div>
        </td>
        <td>
          <div class="div-type">
            <p>{{ item.planoDescricao }}</p>
          </div>
        </td>
        <td class="defaut-format">{{ item.numeroParcela }}</td>
        <td class="defaut-format">R$ {{ item.valor.toFixed(2) }}</td>
        <td class="defaut-format">{{ formatDateBR(item.vencimento) }}</td>
        <td>
          <div class="div-type" [class.danger]="item.status === 'ATRASADA' || item.status === 'CANCELADA'">
            <div style="display: flex; flex-direction: row; justify-content: center; align-items: center;">
              <i class="bi bi-dot" style="margin-left: -6px;"></i>
              <p>{{ item.status }}</p>
            </div>
          </div>
        </td>
        <td class="defaut-format">
          <i class="bi bi-three-dots-vertical" (click)="chosenFinancial.emit(item)"></i>
        </td>
      </tr>
    }
  </tbody>
</table>
