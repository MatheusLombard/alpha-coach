<style>
  :host{
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card-header {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .card-header p{
    color: var(--cor-primaria);
  }
  .card-body .card-value{
    color: var(--cor-success);
    font-weight: 700;
  }
  .card-body p{
    color: var(--cor-primaria);
  }
</style>

<div class="card-header">
  <i [class]="'bi bi-' + icon()"></i>
  <p class="font-label">{{ label() }}</p>
</div>
<div class="card-body">
  <h2 class="card-value">{{ value() }}</h2>
  <p class="card-value-label font-label">{{ sublabel() }}</p>
</div>
