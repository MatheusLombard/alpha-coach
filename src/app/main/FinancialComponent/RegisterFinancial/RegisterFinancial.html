<app-panel title="Registrar Pagamento">
  <div class="container-register">
    <div class="info-row">
      <span class="font-label">ALUNO</span>
      <p class="font-body">{{ aluno() }}</p>
    </div>
    <div class="info-row">
      <span class="font-label">PLANO</span>
      <p class="font-body">{{ plano() }}</p>
    </div>
    <div class="info-row">
      <span class="font-label">VALOR DA PARCELA</span>
      <p class="font-body">R$ {{ valor().toFixed(2) }}</p>
    </div>
    <div class="info-row">
      <span class="font-label">VENCIMENTO</span>
      <p class="font-body">{{ vencimento() }}</p>
    </div>
    <app-input-select
      id="Forma de Pagamento"
      [options]="formaPagamentoOptions"
      [(value)]="formaPagamento"
      [style.grid-column]="'span 2'"
    />
  </div>

  @if (mensagemErro()) {
    <p class="font-label erro-mensagem">{{ mensagemErro() }}</p>
  }

  @if (status() !== 'PAGA') {
    <div class="container-buttons">
      <app-buttons
        icon="check-circle"
        value="CONFIRMAR PAGAMENTO"
        class="send-button"
        [style.flex]="'1'"
        (click)="confirmar.emit()"
      />
    </div>
  } @else {
    <p class="font-label pago-mensagem">Esta parcela já está paga.</p>
  }
</app-panel>
