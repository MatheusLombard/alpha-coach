@for (item of searchExercises(); track item.id) {
  <ul class="ul-exercise" draggable="true" (dragstart)="dragExercise.emit(item)" [class.inativo]="!item.ativo">
    <li class="line-exercise">
      <div class="group-exercise" (click)="chosenExercise.emit(item)">
        <p class="font-body">{{ abbreviation(item.nome) }}</p>
      </div>
      <div class="exercise-desc" (click)="chosenExercise.emit(item)">
        <h3 class="font-body">{{ item.nome }}</h3>
        <h6 [style.color]="'var(--cor-primaria)'">
          @if (item.descricao) {
            {{ item.descricao }}
          } @else {
            Sem descrição
          }
        </h6>
        @if (item.linkVideo) {
          <a [href]="item.linkVideo" target="_blank" rel="noopener" (click)="$event.stopPropagation()" class="font-label">
            <i class="bi bi-play-circle"></i> Ver vídeo
          </a>
        }
      </div>
      <i
        class="bi status-toggle"
        [class.bi-toggle-off]="item.ativo"
        [class.bi-toggle-on]="!item.ativo"
        (click)="toggleStatus.emit(item)"
      ></i>
    </li>
  </ul>
}
