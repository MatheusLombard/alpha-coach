@for (item of searchStudents(); track item.id) {
  <ul class="ul-students" (click)="studentChosen.emit(item)">
    <li class="line-students">
      <div class="group-students">
        <p class="font-body">{{ initials(item.nome) }}</p>
      </div>
      <div>
        <h3 class="font-body">{{ item.nome }}</h3>
        <h6 [style.color]="'var(--cor-primaria)'">
          {{ item.email }}
        </h6>
      </div>
    </li>
  </ul>
} @empty {
  <p class="font-body" style="padding: 16px; color: var(--cor-primaria);">Nenhum aluno ativo encontrado.</p>
}
