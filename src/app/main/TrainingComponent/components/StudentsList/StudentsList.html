@for (item of searchStudents(); track item.id) {
  <ul
    class="ul-students"
    (click)="
      studentChosen.emit({
        id: item.id,
        name: item.name,
        email: item.email,
        avatar: item.avatar,
      })
    "
  >
    <li class="line-students">
      <div class="group-students">
        <p class="font-body">{{ initials(item.name) }}</p>
      </div>
      <div>
        <h3 class="font-body">{{ item.name }}</h3>
        <h6 [style.color]="'var(--cor-primaria)'">
          {{ item.email }}
        </h6>
      </div>
    </li>
  </ul>
}
