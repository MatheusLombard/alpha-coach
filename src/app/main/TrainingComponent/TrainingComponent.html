
<div class="container">
@if (!studentSelected()) {
  <app-panel [style.grid-column]="'span 4'" title="Alunos">
    <app-input-search (valueSearched)="valueSearched($event)"/>
    <app-students-list (studentChosen)="studentChosen($event)" [valueSearched]="valueSearch()"/>
  </app-panel>
}@else {

  <app-panel [style.grid-column]="'span 4'">
    <div class="panel-student">
      <img [src]="studentAvatar()" alt="" class="img-panel-student">
      <p>{{studentName()}}</p>
    </div>
    <app-panel title="Exercícios Vinculados">
      <div class="drop-zone" (dragover)="allowDrop($event)" (drop)="dropExercise($event)">
        @for (item of linkedExercises(); track $index; let i = $index) {
          <div class="vinculado">
            <div class="vinculado-header">
              <p>{{ item.exercise.name }}</p>
              <i class="bi bi-x-lg" (click)="removeLinkedExercise(i)"></i>
            </div>
            <div class="vinculado-campos">
              <app-input-text id="Series" type="number" [value]="item.sets" />
              <app-input-text id="Repeticoes" type="number" [value]="item.reps" />
              <app-input-text id="Carga" type="number" [value]="item.load" />
              <app-input-text id="Descanso (s)" type="number" [value]="item.rest" />
            </div>
          </div>
        } @empty {
          <p class="drop-placeholder">Arraste um exercício da biblioteca para cá</p>
        }
      </div>
    </app-panel>
  </app-panel>
}

  <app-panel [style.grid-column]="'span 4'" title="Biblioteca de Exercícios">
    <app-input-search (valueSearched)="valueSearchedExercise($event)" />
    <app-exercises-list [valueSearched]="valueSearchExercise()" (dragExercise)="startDrag($event)" />
  </app-panel>
</div>
