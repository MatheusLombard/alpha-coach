<app-modal (closeModal)="modal.set($event)" [style.display]="modal() ? 'block' : 'none'">
  <app-register-students
    [(nome)]="nome"
    [(email)]="email"
    [(cpf)]="cpf"
    [(dataNascimento)]="dataNascimento"
    [(telefone)]="telefone"
    [(tipoAluno)]="tipoAluno"
    [(endereco)]="endereco"
    [(objetivo)]="objetivo"
    [(anamnese)]="anamnese"
    [ativo]="ativo()"
    [action]="action()"
    [mensagemErro]="mensagemErro()"
    (salvar)="salvar()"
    (alternarStatus)="alternarStatus()"
  />
</app-modal>

<div class="container-students">
  <app-input-search [style.grid-column]="'span 7'" (valueSearched)="valueSearched($event)" />
  <app-buttons icon="plus-circle" value="Novo Aluno" class="send-button" (click)="novoAluno()" />
  <app-panel [style.grid-column]="'span 8'">
    <app-table-students [valueSearched]="valueSearch()" [items]="alunos()" (chosenStudent)="chosenStudent($event)" />
  </app-panel>
</div>
