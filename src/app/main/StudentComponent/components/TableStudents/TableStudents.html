<table class="font-body">
  <thead>
    <th>Aluno</th>
    <th>CPF</th>
    <th>Tipo</th>
    <th>Telefone</th>
    <th>Status</th>
    <th></th>
  </thead>
  <tbody>
    @for (item of searchStudents(); track item.id) {
      <tr>
        <td>
          <div class="div-students">
            <div class="avatar-placeholder">
              <i class="bi bi-person"></i>
            </div>
            <div class="dsc-students">
              <h3>{{ item.nome }}</h3>
              <p class="font-label">{{ item.email }}</p>
            </div>
          </div>
        </td>
        <td class="defaut-format">{{ item.cpf ?? '-' }}</td>
        <td>
          <div class="div-type">
            <p>{{ item.tipoAluno }}</p>
          </div>
        </td>
        <td class="defaut-format">{{ item.telefone ?? '-' }}</td>
        <td>
          <div class="div-type" [class.danger]="!item.ativo">
            <div
              style="
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
              "
            >
              <i class="bi bi-dot" style="margin-left: -6px"></i>
              <p>{{ item.ativo ? 'ATIVO' : 'INATIVO' }}</p>
            </div>
          </div>
        </td>
        <td class="defaut-format menu-cell">
          <i class="bi bi-three-dots-vertical" (click)="toggleMenu(item.id)"></i>
          @if (openMenuId() === item.id) {
            <div class="menu-dropdown">
              <button type="button" (click)="editar(item)">
                <i class="bi bi-pencil-square"></i>
                Editar
              </button>
              <button type="button" (click)="matricular(item)">
                <i class="bi bi-journal-plus"></i>
                Matricular
              </button>
            </div>
          }
        </td>
      </tr>
    }
  </tbody>
</table>
