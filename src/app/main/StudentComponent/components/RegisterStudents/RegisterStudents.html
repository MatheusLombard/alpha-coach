<app-panel [title]="action() === 'update' ? 'Editar Aluno' : 'Cadastro de Aluno'">
  <div class="container-register">
    <app-input-text [style.grid-column]="'span 2'" id="Nome" type="text" [(value)]="nome" />
    <app-input-text id="Email" type="email" [(value)]="email" />
    <app-input-text id="Telefone" type="tel" [(value)]="telefone" />
    <app-input-text id="CPF" type="text" [(value)]="cpf" />
    <app-input-text id="Data de Nascimento" type="date" [(value)]="dataNascimento" />
    <app-input-select
      id="Tipo de Atendimento"
      [options]="tipoAlunoOptions"
      [(value)]="tipoAluno"
      [style.grid-column]="'span 2'"
    />
    <app-input-text [style.grid-column]="'span 2'" id="Endereço" type="text" [(value)]="endereco" />
    <app-input-text [style.grid-column]="'span 2'" id="Objetivo" type="text" [(value)]="objetivo" />
    <app-input-area [style.grid-column]="'span 2'" id="Anamnese" [(value)]="anamnese" />
  </div>

  @if (mensagemErro()) {
    <p class="font-label erro-mensagem">{{ mensagemErro() }}</p>
  }

  <div class="container-buttons">
    <app-buttons
      icon="check-circle"
      [value]="action() === 'update' ? 'SALVAR' : 'CADASTRAR'"
      class="send-button"
      [style.flex]="'1'"
      (click)="salvar.emit()"
    />
    @if (action() === 'update') {
      <app-buttons
        [icon]="ativo() ? 'person-x' : 'person-check'"
        [value]="ativo() ? 'INATIVAR' : 'REATIVAR'"
        [style.flex]="'1'"
        (click)="alternarStatus.emit()"
      />
    }
  </div>
</app-panel>
