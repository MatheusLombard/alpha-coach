<style></style>

<table class="font-body">
  <thead>
    <th>Aluno</th>
    <th>Tipo</th>
    <th>Plano</th>
    <th>Desde</th>
    <th>Status</th>
    <!-- <th></th> -->
  </thead>
  <tbody>
    @for (item of listStudents; track $index) {
      <tr>
        <td>
          <div class="div-students">
            <img [src]="item.avatar" class="avatar" alt="avatar" />
            <div class="dsc-students">
              <h3>{{ item.nome }}</h3>
              <p class="font-label">{{ item.email }}</p>
            </div>
          </div>
        </td>
        <td>
          <div class="div-type">
            <p>{{ item.tipo }}</p>
          </div>
        </td>
        <td class="defaut-format">
          <p>
            {{ item.plano }}
          </p>
        </td>
        <td class="defaut-format">{{ item.desde }}</td>
        <td>
          <div class="div-type danger">
            <div
              style="
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
              "
            >
              <i class="bi bi-dot" style="margin-left: -6px"></i>
              <p>{{ item.status.toLocaleUpperCase().replace('-', ' ') }}</p>
            </div>
          </div>
        </td>
        <td class="defaut-format">
          <i
            class="bi bi-three-dots-vertical"
            (click)="
              chosedStudents.emit({
                id: item.id,
                nome: item.nome,
                email: item.email,
                avatar: item.avatar,
                tipo: item.tipo,
                plano: item.plano,
                desde: item.desde,
                status: item.status
              })
            "
          ></i>
        </td>
      </tr>
    }
  </tbody>
</table>
