<style>
  .list-distribution{
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .list-distribution p{
    align-self: flex-start;
  }
.progress-bar {
  height: 6px;
  border-radius: 4px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 4px;
}
.progress-bar-fill.info { background: var(--cor-accent); }
.progress-bar-fill.success { background: var(--cor-success); }
.progress-bar-fill.warning { background: var(--cor-warning); }
</style>

@for (item of plans; track $index) {
  <ul style="list-style-type: none; margin-top: 8px;">
    <li class="list-distribution">
      <p class="font-body" >{{item.label}}</p>
      <div class="progress-bar">
         <div [class]="'progress-bar-fill ' + item.color" [style.width.%]="percentage(item.value)"></div>
      </div>
    </li>
  </ul>
}
