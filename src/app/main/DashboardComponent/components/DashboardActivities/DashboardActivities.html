<style>
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.status-dot.success { background: var(--cor-success); }
.status-dot.info { background: var(--cor-accent); }
.status-dot.warning { background: var(--cor-warning); }
.status-dot.danger { background: var(--cor-danger); }

  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ffffff3a;
    padding: 16px;
    gap: 16px
  }

  .list-item-avatar {
    width: 50px;
    height: 50px;
    border-radius: 16px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cor-accent);
    font-weight: 800;
    flex-shrink: 0;
  }
  .list-item-desc{
    flex: 1;
  }
  .list-item-status{
    display: flex;
    align-items: center;
    gap: 8px
  }
</style>

@for (item of items(); track item.id) {
  <ul style="list-style-type: none">
    <li class="list-item">
      <div class="list-item-avatar">{{ initials(item.name) }}</div>
      <div class="list-item-desc">
        <p class="font-subtitle">{{ item.name }}</p>
        <p class="font-body">{{ item.description }}</p>
      </div>
      <div class="list-item-status">
        <p class="font-body">{{ item.time }}</p>
        <div [class]="'status-dot ' + item.status"></div>
      </div>
    </li>
  </ul>
} @empty {
  <p class="font-body" style="padding: 16px; color: var(--cor-primaria);">Nenhuma matrícula registrada ainda.</p>
}
