<div class="radio-form">
  <label [for]="id()" class="radio-label font-label" style="display: block">{{
    id().toUpperCase()
  }}</label>
  <div class="radio-options">
    @for (option of options(); track $index) {
      <button (click)="optionSelected(option)" class="option" [class.active]="choosed() === option">
        {{ option }}
      </button>
    }
  </div>
</div>
